# ===================================================
# app-apex 全栈网站 (Vue3 + Java21)
# 通过域名 realapex.site:8083 或 IP:8083 以 HTTPS 方式访问
# 部署路径：/etc/nginx/conf.d/app-apex.conf
# ===================================================

server {
    # 8083 端口走 HTTPS
    listen 8083 ssl;
    server_name realapex.site 129.211.9.238;

    # 允许大文件上传（默认 1M，此处放开到 500M）
    client_max_body_size 500m;

    # SSL 证书配置
    ssl_certificate /etc/nginx/cert/realapex.site_bundle.pem;
    ssl_certificate_key /etc/nginx/cert/realapex.site.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 1. 前端静态页面托管
    location / {
        root /var/www/app-apex/dist;
        index index.html;
        try_files $uri $uri/ /index.html; # Vue Router history 模式
    }

    # 2. 后端 API 反向代理（转发到 Docker 容器暴露的 8093 端口）
    location /api/ {
        proxy_pass http://127.0.0.1:8093/api/;

        # HTTP/1.1 支持 chunked encoding，大文件流式上传/下载必备
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件传输超时放宽至 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # AI 流式接口 + 文件下载必须关闭缓冲，实现打字机效果逐块传递
        proxy_buffering off;
        proxy_cache off;
    }
}