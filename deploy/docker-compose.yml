# 本地开发环境全家桶一键部署
services:
  app:
    build:
      context: ../java-apex-server     # 指向上一层后端源码目录
      dockerfile: Dockerfile
    container_name: apex-server
    ports:
      - "8093:8093"                    # 暴露后端本地端口
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root123
    networks:
      - apex-internal
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: ../web-apex-vue
      dockerfile: Dockerfile
    container_name: apex-nginx
    ports:
      - "80:80"
    networks:
      - apex-internal
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: apex-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: apex_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - apex-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:

networks:
  apex-internal:
    driver: bridge
