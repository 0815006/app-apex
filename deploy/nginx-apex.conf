# ===================================================
# app-apex 全栈网站 (Vue3 + Java21)
# 支持通过域名 realapex.site (80端口) 或 IP:8083 直接访问
# 部署路径：/etc/nginx/conf.d/app-apex.conf
# ===================================================

server {
    # 域名走标准 80 端口，IP 直连走 8083 端口，两种同时工作
    #listen 80;
    listen 8083;
    server_name realapex.site 129.211.9.238;

    # 1. 前端静态页面托管
    location / {
        root /var/www/app-apex/dist;
        index index.html;
        try_files $uri $uri/ /index.html; # 支持 Vue Router 的 history 模式
    }

    # 2. 后端 API 反向代理
    location /api/ {
        # 转发到 Docker 暴露出来的 8093 端口（对应 .bat 里的 -p 8093:8093）
        proxy_pass http://127.0.0.1:8093/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}