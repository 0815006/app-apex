# ===================================================
# 3. HTTP 端口 8083：分配给 app-apex 全栈网站 (Vue3 + Java21)
# 文档上传到服务器 /etc/nginx/conf.d/
# ===================================================

server {
    listen 8083;
    server_name _; # 允许通过 129.211.9.238:8083 直接访问

    # 1. 前端静态页面托管
    location / {
        root /var/www/app-apex/dist; # 前端nginx位置
        index index.html;
        try_files $uri $uri/ /index.html; # 支持 Vue Router 的 history 模式
    }

    # 2. 后端 API 反向代理
    location /api/ {
        # 转发到 Docker 暴露出来的 8093 端口（对应 .bat 里的 -p 8093:8093）
        proxy_pass http://127.0.0.1:8093/api/; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}