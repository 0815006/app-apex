server:
  port: 8081

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILE_MAX_SIZE:200MB}
      max-request-size: ${FILE_MAX_SIZE:200MB}
  application:
    name: java-apex-server
  threads:
    virtual:
      enabled: true
  output:
    ansi:
      enabled: always

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/apex_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# =============================================
# Apex 自定义配置
# =============================================
apex:
  file-share:
    storage-path: ${FILE_STORAGE_PATH:D:\data\apex-v1\file-share}
    max-file-size: ${FILE_MAX_SIZE:200MB}
  llm:
    stream: ${LLM_STREAM_ENABLED:true}
